name: Build Termux Package

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          chmod +x build-package.sh
          bash build-package.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaolang-deb
          path: yaolang_*.deb
